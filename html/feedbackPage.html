<!doctype html>

<html lang="en">
  <head>
    <!--Link to CSS file-->
    <link rel="stylesheet" href="../css/dashboard.css" />
    <!--Link to JS file-->

    <!--Responsiveness-->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--Bootstrap-->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
      
    ></script>

    <title>View Feedback Forms</title>
  </head>

  <body class="d-flex flex-column min-vh-100">
    <!--Nav Bar: Boostrap-->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
      <a class="navbar-brand" href="../html/EmployeeDashboard.html"
        >- Breakroom -</a
      >
      <button
        class="navbar-toggler"
        type="button"
        data-toggle="collapse"
        data-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
          <li class="nav-item active">
            <a class="nav-link" href="/html/EmployeeDashboard.html">Modules</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/html/feedbackPage.html">Feedback</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/html/certificatePage.html">Certificates</a>
          </li>
        </ul>
      </div>
    </nav>

    <main class="flex-fill container mt-5">
      <div id="feedbackFormSection">
        <h2>Module Feedback</h2>
        <p>
          Please let us know how you found the module to receive your
          certificate.
        </p>

        <form id="feedbackForm">
          <div class="mb-3">
            <label class="form-label">How would you rate this training?</label>
            <select class="form-select" required>
              <option value="5">Excellent</option>
              <option value="4">Good</option>
              <option value="3">Average</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Any comments?</label>
            <textarea class="form-control" rows="3"></textarea>
          </div>
          <button
            type="button"
            class="btn btn-primary"
            onclick="submitFeedback()"
          >
            Submit & Get Certificate
          </button>
        </form>
      </div>

      <div
        id="certificate"
        class="hidden"
        style="
          display: none;
          position: fixed;
          top: 50%;
          left: 50%;
          transform: translate(-50%, -50%);
          z-index: 1000;
          background: white;
          padding: 20px;
          border: 5px solid gold;
          box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        "
      >
        <div class="certificateCard text-center">
          <h1>Certificate of Completion</h1>
          <p>This certifies that</p>
          <h2 id="employeeName">Loading...</h2>
          <p>has successfully completed</p>
          <h3 id="moduleName">Loading...</h3>
          <p>
            Issued on: <span id="certDate"></span><br />
            ID: <span id="certId"></span>
          </p>
          <div id="qrCode" class="d-flex justify-content-center mb-3"></div>
          <button class="btn btn-success" onclick="window.print()">
            Download
          </button>
          <button
            class="btn btn-danger"
            onclick="
              document.getElementById('certificate').style.display = 'none'
            "
          >
            Close
          </button>
        </div>
      </div>
    </main>

    <!--Footer-->
    <footer class="footer">
      <p>© 2026 BreakRoom Training Platform</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js"></script>
<script src="../js/certificate.js"></script>

<script>
    // Simple function to bridge the Feedback to the Certificate logic
    function submitFeedback() {
        alert("Feedback submitted! Generating your certificate...");
        // Hide the form
        document.getElementById('feedbackFormSection').style.opacity = '0.3';
        // Show the certificate div
        document.getElementById('certificate').style.display = 'block';
        // Call the function inside certificate.js to fetch the real data
        getRealCertData(); 
    }
</script>
  </body>
</html>
