<!DOCTYPE html>
<html lang="en">
    
    <head> 
        <!--Link to CSS Stylesheet-->
        <link rel="stylesheet" href="../css/CreateModule.css">
        <!--Link to JS Script-->
        <script src="../js/CreateModule.js" defer></script>
         <!--Responsiveness-->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <!--Bootstrap-->
        <meta name="viewport" content="width=device-width, initial-scale=1">
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
		<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

        <title>Create Module</title>

    </head>

    <body> 
        <!--Boostrap Nav bar-->
        <nav class="navbar navbar-expand-lg navbar-light bg-light">

        <a class="navbar-brand" href="/html/EmployerDashboard.html">- Breakroom -</a>

        <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
            <li class="nav-item active">
                <a class="nav-link" href="/html/EmployeeDashboard.html">Assign Modules</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/html/employees.html">Employees</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="/html/CreateModule.html">Create Module</a>
            </li>
            </ul>
        </div>

        </nav>
        <!--Module Form-->
        <h1 id="createModuleHeading">Create Module</h1>

        <form id="createModuleForm" enctype="multipart/form-data"> <!--https://www.w3schools.com/tags/att_form_enctype.asp-->

        <h2 id="moduleDetailsHeading">Module Details</h2>

        <label>Module Title:</label>
        <input type="text" name="title" required>
        <br><br>

        <label>Description:</label>
        <textarea name="description" required></textarea> <!--Need more room-->
        <br>

        <label>Category:</label>
        <input type="text" name="category" required>
        <br>

        <label>Pass Mark (%):</label>
        <input type="number" name="passScore" min="0" max="100" required>
        <br><br>
        <!--upload an image for the grid-->
        <!--https://www.w3schools.com/tags/att_input_accept.asp-->
        <!--https://www.w3schools.com/tags/tag_small.asp-->
        <div class="mb-3"> <!--For the Bootstrap class-->
            <label for="moduleImage">Module Image</label>
            <input 
                type="file" 
                id="moduleImage" 
                name="moduleImage"
                accept="image/*" 
                required
            >
            <small class="text-muted">Upload an image to represent this module in the module grid.</small>
        </div>
        
        <br><br><br>

        <h2 id="puzzleCreationHeading">Puzzle Content</h2>
        <br>
        <div class="puzzle">
        <label>Puzzle Format:</label>
            <select name="puzzleType">

                <option value="">Select a format</option> <!--Don't force them to choose-->

                <option value="multipleChoice">
                Multiple Choice – user selects the correct answer
                </option>

                <option value="dragOrder">
                Drag & Drop – arrange steps in the correct order
                </option>

                <option value="matching">
                Matching – match items together
                </option>

                <option value="spotMistake">
                Spot Mistake – identify mistakes
                </option>

                <option value="rapidFire">
                Rapid Fire – timed multiple choice questions
                </option>

            </select>
        <br><br>

        <label>Puzzle Instructions:</label>
        <textarea name="puzzleInstructions" required></textarea>

        <label>Media Type: </label>
        <br><br>
        <select class="mediaType">

        <option value="">Select Media Type</option>
        <option value="text">Text</option>
        <option value="image">Image</option>
        <option value="video">Video</option>
        <option value="file">File</option>
        <option value="mixture">Mixture</option>
        </select>

        <div class="mediaInput"></div>
        <br><br>
        <button type="button" id="addPuzzle">Add Another Puzzle</button>

        <button type="submit">Create Module</button>
    </div>
        </form>
        <br><br>
        <!--Footer-->
        <footer class="footer">
            <p>© 2026 BreakRoom Training Platform</p>
        </footer>

    </body>
</html>
